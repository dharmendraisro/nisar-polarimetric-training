[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-polarimetric-training"
version = "1.0.0"
description = "Python/Jupyter training and research toolkit for NISAR L2 GCOV polarimetric analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Dharmendra Kumar Pandey" }
]
keywords = ["NISAR", "GCOV", "SAR", "polarimetry", "remote sensing", "Earth observation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
